<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Resume Reviewer</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>AI Resume Reviewer</h1>

    <p class="subtitle">
      Get AI-powered feedback to improve your resume
    </p>


    <!-- Resume -->

    <div class="input-section">

      <label for="resume-input">
        Your Resume
      </label>

      <textarea id="resume-input" placeholder="Paste your complete resume here..."></textarea>

    </div>


    <!-- Job Description -->

    <div class="input-section">

      <label for="job-input">
        Job Description
        <span>(Optional)</span>
      </label>

      <textarea id="job-input" placeholder="Paste the job description here..."></textarea>

    </div>


    <!-- Additional Instructions -->

    <div class="input-section">

      <label for="instructions-input">
        Additional Instructions
        <span>(Optional)</span>
      </label>

      <textarea id="instructions-input" class="small-textarea"
        placeholder="Example: Focus on ATS compatibility and my projects."></textarea>

    </div>


    <!-- Button -->

    <button id="review-button">
      Review Resume
    </button>


    <!-- Result -->

    <div id="result-box"></div>

  </div>


  <!-- Markdown parser -->



  <script src="script.js"></script>

</body>

</html>
